name: Windows demonstration candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-windows-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact public dependency graph
        id: pins
        run: python .github/dependency_pins.py full
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochGui
          ref: ${{ steps.pins.outputs.gui }}
          path: dependencies/EpochGui
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochPlatformEngine
          ref: ${{ steps.pins.outputs.platform }}
          path: dependencies/EpochPlatformEngine
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochAudioEngine
          ref: ${{ steps.pins.outputs.audio }}
          path: dependencies/EpochAudioEngine
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochMediaEngine
          ref: ${{ steps.pins.outputs.media }}
          path: dependencies/EpochMediaEngine
          persist-credentials: false
      - name: Check source package boundaries
        run: python -B -m unittest discover -s tests -p '*_test.py'
      - name: Install pinned CMake
        run: python -m pip install cmake==4.4.2
      - name: Build complete offline source candidate
        shell: pwsh
        run: |
          python -B tools/package_source.py --dependency-root dependencies --output-dir build/candidates/source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = Join-Path $PWD "build/candidates/source/EpochGui_Demo-v$version-source.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath build/offline-source
          "DEMO_PROJECT_SOURCE=$PWD/build/offline-source/EpochGui_Demo-v$version-source" >> $env:GITHUB_ENV
          "DEMO_SOURCE_ZIP=$zip" >> $env:GITHUB_ENV
      - name: Configure the extracted full Platform graph
        shell: pwsh
        run: |
          cmake -S "$env:DEMO_PROJECT_SOURCE" -B build/offline-build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DEPOCHGUI_DEMO_COMPOSITION=full -DEPOCHGUI_DEMO_HOST=platform -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Debug build and CPU contracts first
        shell: pwsh
        run: |
          cmake --build build/offline-build --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/offline-build -C Debug --output-on-failure --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release build and CPU contracts
        shell: pwsh
        run: |
          cmake --build build/offline-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/offline-build -C Release --output-on-failure --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the exact extracted-source executable
        shell: pwsh
        run: |
          python -B tools/package_runtime.py --binary build/offline-build/Release/EpochGuiDemo.exe --source-zip "$env:DEMO_SOURCE_ZIP" --platform windows-x64 --output-dir build/candidates/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github/audit_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: demo-windows-candidate
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          path: |
            build/candidates/source/*.zip
            build/candidates/source/*.zip.sha256
            build/candidates/runtime/*.zip
            build/candidates/runtime/*.zip.sha256
            build/audits/source-audit.json
      - name: Native acceptance remains separate
        run: echo "Candidate artifacts only. An owner must test the exact extracted executable before a manual release." >> $env:GITHUB_STEP_SUMMARY
