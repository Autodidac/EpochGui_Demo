name: Linux demonstration candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-linux-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact public dependency graph
        id: pins
        run: python .github/dependency_pins.py full
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochGui
          ref: ${{ steps.pins.outputs.gui }}
          path: dependencies/EpochGui
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochPlatformEngine
          ref: ${{ steps.pins.outputs.platform }}
          path: dependencies/EpochPlatformEngine
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochAudioEngine
          ref: ${{ steps.pins.outputs.audio }}
          path: dependencies/EpochAudioEngine
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Autodidac/EpochMediaEngine
          ref: ${{ steps.pins.outputs.media }}
          path: dependencies/EpochMediaEngine
          persist-credentials: false
      - name: Check source package boundaries
        run: python -B -m unittest discover -s tests -p '*_test.py'
      - name: Install native Clang build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ninja-build g++-14 libgl1-mesa-dev libx11-dev libxext-dev
          curl --fail --location --retry 3 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y clang-tools-22
          python -m pip install cmake==4.4.2
      - name: Build complete offline source candidate
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/package_source.py --dependency-root dependencies --output-dir build/candidates/source
          version="$(tr -d '[:space:]' < VERSION)"
          zip="$GITHUB_WORKSPACE/build/candidates/source/EpochGui_Demo-v$version-source.zip"
          python -m zipfile -e "$zip" build/offline-source
          echo "DEMO_PROJECT_SOURCE=$GITHUB_WORKSPACE/build/offline-source/EpochGui_Demo-v$version-source" >> "$GITHUB_ENV"
          echo "DEMO_SOURCE_ZIP=$zip" >> "$GITHUB_ENV"
      - name: Debug build and CPU contracts first
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$DEMO_PROJECT_SOURCE" -B build/offline-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-22 -DBUILD_TESTING=ON -DEPOCHGUI_DEMO_COMPOSITION=full -DEPOCHGUI_DEMO_HOST=native
          cmake --build build/offline-debug --parallel 2
          ctest --test-dir build/offline-debug --output-on-failure --timeout 60
      - name: Release build and CPU contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$DEMO_PROJECT_SOURCE" -B build/offline-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-22 -DBUILD_TESTING=ON -DEPOCHGUI_DEMO_COMPOSITION=full -DEPOCHGUI_DEMO_HOST=native
          cmake --build build/offline-release --parallel 2
          ctest --test-dir build/offline-release --output-on-failure --timeout 60
          ldd build/offline-release/EpochGuiDemo > build/offline-release/shared-libraries.txt
          if grep -F 'not found' build/offline-release/shared-libraries.txt; then exit 1; fi
      - name: Package the exact extracted-source executable
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/package_runtime.py --binary build/offline-release/EpochGuiDemo --source-zip "$DEMO_SOURCE_ZIP" --platform linux-x64 --output-dir build/candidates/runtime
          python -B .github/audit_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-linux-candidate
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          path: |
            build/candidates/source/*.zip
            build/candidates/source/*.zip.sha256
            build/candidates/runtime/*.zip
            build/candidates/runtime/*.zip.sha256
            build/audits/source-audit.json
      - name: Native acceptance remains separate
        shell: bash
        run: echo 'Candidate artifacts only. Linux native input, drawing and shutdown remain an owner acceptance gate.' >> "$GITHUB_STEP_SUMMARY"
